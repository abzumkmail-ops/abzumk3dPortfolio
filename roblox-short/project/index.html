<script>
// Interactive preview when opened in a browser: ?play=1 loops in real time (no audio).
if (new URLSearchParams(location.search).has('play')) {
  const t0 = performance.now();
  const loop = () => { if (window.READY) seek(((performance.now() - t0) / 1000) % window.END); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
